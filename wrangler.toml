name = "marketpost"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# account_id = "<CLOUDFLARE_ACCOUNT_ID>"
# routes = [{ pattern = "<CUSTOM_DOMAIN>", custom_domain = true }]
# 自定义域名待主人确认；占位注释不生效，禁止部署。
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "local"
# Cloudflare Access 预留：部署前保护页面和 GET；POST /v1/feed 路径放行。
# GET /v1/* 在非 local/test 环境强制校验 JWT；ACCESS_TEAM_DOMAIN / ACCESS_AUD 私密注入。

[[d1_databases]]
binding = "DB"
database_name = "marketpost-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
